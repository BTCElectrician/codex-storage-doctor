name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tooling
        run: python -m pip install --upgrade "setuptools==83.0.0" "wheel==0.47.0"
      - name: Install local package
        run: python -m pip install --no-deps -e .
      - name: Unit and integration tests
        run: python scripts/run_tests.py
      - name: Distribution validation
        run: python scripts/validate_distribution.py
      - name: Privacy leak guard
        run: python scripts/leak_guard.py
      - name: Build zipapp
        run: python scripts/build_zipapp.py
      - name: Zipapp smoke
        run: python dist/codex-storage-doctor.pyz --version
      - name: Build wheel
        run: python scripts/build_wheel.py
      - name: Verify packaged source bytes
        run: python scripts/verify_artifacts.py
      - name: Wheel install smoke
        run: python -m pip install --force-reinstall --no-deps dist/codex_storage_doctor-0.1.0-py3-none-any.whl
      - name: Console entry-point smoke
        run: codex-storage-doctor --version
