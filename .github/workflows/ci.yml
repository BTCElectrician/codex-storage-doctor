name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install local package
        run: python -m pip install --no-deps -e .
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Distribution validation
        run: python scripts/validate_distribution.py
      - name: Privacy leak guard
        run: python scripts/leak_guard.py
      - name: Build zipapp
        run: python scripts/build_zipapp.py
      - name: Zipapp smoke
        run: python dist/codex-storage-doctor.pyz --version
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Wheel install smoke
        run: python -m pip install --force-reinstall --no-deps dist/codex_storage_doctor-0.1.0-py3-none-any.whl
      - name: Console entry-point smoke
        run: codex-storage-doctor --version
